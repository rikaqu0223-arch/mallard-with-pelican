<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" fill="none" role="img" aria-labelledby="title description">
  <title id="title">A bicycle built for two birds</title>
  <desc id="description">A white pelican pedals a coral bicycle. A green-headed mallard rides in the wicker basket above the rear wheel. The illustration has a transparent background.</desc>

